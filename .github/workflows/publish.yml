name: Generate science short

# Runs the pipeline unattended on a schedule and publishes straight to
# YouTube (public) once it renders successfully — no manual review step.
# REQUIRE_MANUAL_APPROVAL and UPLOAD_VISIBILITY are hardcoded below, not
# read from repo vars, so this behavior can't drift from an unrelated
# variable change. See .github/workflows/retry-on-failure.yml for what
# happens if a scheduled run fails.

on:
  schedule:
    # Twice a day, 12 hours apart — adjust to your preferred generation
    # times. Cron uses UTC regardless of your local timezone.
    - cron: "0 14 * * *"  # ~morning for US audiences (10am ET / 7am PT)
    - cron: "0 2 * * *"   # ~evening for US audiences (10pm ET / 7pm PT)
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab for testing

permissions:
  contents: write  # to commit state/used_topics.json back after the run

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline and publish
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ vars.TTS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Hardcoded, not ${{ vars.* }} — see comment above.
          REQUIRE_MANUAL_APPROVAL: "false"
          UPLOAD_VISIBILITY: "public"
        run: python -m pipeline.orchestrator

      - name: Find this run's render directory
        id: find_dir
        run: echo "dir=$(ls -td render/*/ | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload rendered video + metadata (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ github.run_id }}
          path: ${{ steps.find_dir.outputs.dir }}
          retention-days: 30

      - name: Commit updated state files
        run: |
          git config user.name "science-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update state after run $(date -u +%Y-%m-%d)"
          git push
