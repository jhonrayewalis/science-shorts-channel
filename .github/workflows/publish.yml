name: Publish daily short

on:
  schedule:
    # Runs at 14:00 UTC daily — adjust to your preferred publish time.
    # Cron uses UTC regardless of your local timezone.
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab for testing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ vars.TTS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMAGE_GEN_PROVIDER: ${{ vars.IMAGE_GEN_PROVIDER }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          UPLOAD_VISIBILITY: ${{ vars.UPLOAD_VISIBILITY }}
          REQUIRE_MANUAL_APPROVAL: ${{ vars.REQUIRE_MANUAL_APPROVAL }}
        run: python -m pipeline.orchestrator

      - name: Commit updated state files
        run: |
          git config user.name "science-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update state after run $(date -u +%Y-%m-%d)"
          git push
